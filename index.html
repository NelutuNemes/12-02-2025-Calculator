<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- <h5>My App</h5> -->
    </header>
    <main>
        <div class="container">

        <div class="extendedDisplay" id="extendedDisplay">
            <div id="amount">-Amount: 0.00</div>
            <div id="vat">-VAT: 0 %</div>
            <div id="vat-value">-VAT value: 0.00</div>
            <div id="amountPlusVat">-Final Result : 0</div>
            <vat></vat>
        </div>

        <div class="display" id="display"></div>

            <div class="toggle-operations">
                <input type="radio" name="toggleOps" id="basic" checked>
                <label for="basic">Basic</label>        
                <input type="radio" name="toggleOps" id="show-extra-ops">
                <label for="show-extra-ops">Advanced Operations</label>
                <input type="radio" name="toggleOps" id="vat-handler">
                <label for="vat-handler">VAT Helper</label>

            </div>
            <div class="buttons">
                <button class="btn clear" data-value="C">C</button>
                <button class="btn delete" data-value="DEL">DEL</button>
                <button class="btn equal" data-value="=">=</button>
            <div class="percent">
                <button class="btn operator " id="percent-btn-plus"  data-value="+PRC">+ V.A.T</button>
                <button class="btn operator " id="percent-btn-minus" data-value="-PRC">- V.A.T</button>
            </div>
            <div class="extra-operations">
                <button class="btn operator" data-value="^^">x<sup>2</sup></button>
                <button class="btn operator" data-value="^">x<sup>y</sup></button>
                <button class="btn operator" data-value="SQUARE2"><sup>2</sup>&Sqrt;x</button>
                <button class="btn operator" data-value="SQUARE3"><sup>3</sup>&Sqrt;x</button>
            </div>

                <button class="btn" id="number" data-value="7">7</button>
                <button class="btn" id="number" data-value="8">8</button>
                <button class="btn" id="number" data-value="9">9</button>
                <button class="btn operator" data-value="/">/</button>
                <button class="btn" id="number" data-value="4">4</button>
                <button class="btn" id="number" data-value="5">5</button>
                <button class="btn" id="number" data-value="6">6</button>
                <button class="btn operator" data-value="*">*</button>
                <button class="btn" id="number" data-value="1">1</button>
                <button class="btn" id="number" data-value="2">2</button>
                <button class="btn" id="number" data-value="3">3</button>
                <button class="btn operator" data-value="-">-</button>
                <button class="btn zero" id="number" data-value="0">0</button>
                <button class="btn" id="number" data-value=".">.</button>
                <button class="btn operator" data-value="+">+</button>

            </div>
        </div>
    </main>
    <footer>
<p>Copyright &copy; 2025 Designed & Developed by Ioan Nemes </p>
<p> Built with ❤️ and dedication | Open-source project | Contributions may be accepted in the future!</p>
</footer>



    <script src="script.js"></script>
</body>
</html>
